services:
  # 1. API Servisi
  api:
    image: pixelv0-api
    build:
      context: .
      dockerfile: PixelV0.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=pixelv0_db;Username=postgres;Password=${POSTGRES_PASSWORD}
      - JwtSettings__Secret=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  # 2. React Frontend Servisi
  web:
    image: pixelv0-web
    build:
      context: ./PixelV0.WebApp
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

  # 3. PostgreSQL Servisi
  postgres:
    image: postgres:16-alpine
    container_name: pixelv0_postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=pixelv0_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pixelv0_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: